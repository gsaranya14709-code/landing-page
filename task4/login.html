<!DOCTYPE html>
<html>
<head>
    <title>Login - Travelia</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header>
        <h2>TRAVELIA</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="destinations.html">Destinations</a>
            <a href="contact.html">Contact</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <section class="left">
            <h1>TRAVEL<br>BEYOND<br>ORDINARY.</h1>
            <p>Every journey begins with a single step.</p>
        </section>
        <section class="right">
            <h2>Welcome Back</h2>
            <p class="sub">Login to continue your journey</p>
            <form>
                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Enter your password">

                <button>LOGIN</button>
            </form>
            <p class="or">or</p>
            <button class="google">Continue with Google</button>
            <hr>
            <h3>New to Travelia?</h3>
            <p>Create an account and start exploring.</p>
            <form>
                <label>Name</label>
                <input type="text" placeholder="Enter your name">

                <label>Email</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Create a password">

                <button>REGISTER</button>
            </form>
        </section>
    </main>
</body>
</html>
