<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Way To Paradise</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <header>
        <nav>
            <a href="home.html" class="nav-link">HOME</a>
            <a href="about.html" class="nav-link">ABOUT US</a>
            <a href="#" class="nav-link">DESTINATIONS</a>
            <a href="contact.html" class="nav-link">CONTACT US</a>
            <a href="#" class="nav-link">DISCOUNTS</a>
            <a href="#" class="nav-link">LOGIN</a>
        </nav>
    </header>
    <div class="contact">
    <h1>Contact Us</h1>
    <p>
        Have a question or want to plan your next trip?
        Send us a message.
    </p>
    <h2>Get in Touch</h2>
    <p>Email: hello@waytoparadise.com</p>
    <p>Phone: +91 98765 43210</p>
    <p>Location: Chennai, India</p>
    <h2>Send us a message</h2>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <br><br>
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="Enter subject">
        <br><br>
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write your message"></textarea>
        <br><br>
        <button type="submit">Send Message</button>
    </form>
    </div>
    <footer>
        <p>Every journey begins with a hello.</p>
    </footer>
</body>
</html>
